# Agent R1 training defaults for SelfEvolvingPrivacyRL.
#
# This is the Hydra primary config loaded by
# training/iterative_train_with_agentr1.sh. Runtime values that change per
# round (dataset/checkpoint paths, total steps, GPU count) remain shell
# overrides in that script.

defaults:
  - ppo_trainer
  - /overrides/rollout@actor_rollout_ref.rollout
  - _self_

# Make verl's packaged trainer configs visible when this project-owned config
# is selected with --config-dir.
hydra:
  searchpath:
    - pkg://verl.trainer.config

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true

data:
  train_batch_size: 8
  max_prompt_length: 1024
  max_response_length: 192
  return_raw_chat: true
  filter_overlong_prompts: true

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: true

  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 1.0e-2
    entropy_coeff: 5.0e-3
    fsdp_config:
      param_offload: true
      optimizer_offload: true
    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]

  rollout:
    name: vllm
    max_model_len: 1280
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    n: 2
    temperature: 1.0
    top_p: 0.95
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      num_workers: 4

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

critic:
  enable: false

reward_model:
  enable: false

custom_reward_function:
  path: /home/fangzibang/SelfEvolvingPrivacyRL/reward/agentr1_reward_wrapper.py
  name: compute_score

trainer:
  logger: [console, file]
  log_val_generations: 3
  project_name: SelfEvolvingPrivacyRL
  # Keep this high; total_training_steps is supplied per round by the script.
  total_epochs: 1000
  val_before_train: false
  test_freq: -1
  save_freq: 50
  max_actor_ckpt_to_keep: 3
  nnodes: 1
